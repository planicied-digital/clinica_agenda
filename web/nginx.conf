server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # O host (nginx da VPS) faz proxy_pass removendo o prefixo /sistemas/agendaclinica/
    # antes de repassar pra esse container — ou seja, aqui dentro as requisições chegam
    # como se a raiz do container FOSSE a raiz do app (ex: "/", "/assets/x.js").
    # Por isso o container serve tudo a partir de "/" mesmo, sem reescrever nada:
    # os assets do build (gerados com base "/sistemas/agendaclinica/") ficam em
    # /usr/share/nginx/html e são resolvidos normalmente pelo "root" acima.
    # IMPORTANTE: não usar "return 30x" para caminhos relativos tipo "/sistemas/agendaclinica/"
    # aqui dentro — o container só enxerga HTTP puro (não sabe que está atrás de HTTPS),
    # então o Location gerado viria como "http://..." e o certbot no host forçaria de volta
    # pra "https://...", causando loop infinito de redirecionamento (ERR_TOO_MANY_REDIRECTS).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
