server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Assets são gerados com base "/sistemas/agendaclinica/" (vite.config.ts)
    # e ficam fisicamente na raiz do container — precisa de alias, não root,
    # senão o nginx procura em /usr/share/nginx/html/sistemas/agendaclinica/
    # e cai no fallback do SPA, servindo index.html no lugar do JS.
    location /sistemas/agendaclinica/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /sistemas/agendaclinica/index.html;
    }

    location = / {
        return 302 /sistemas/agendaclinica/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
