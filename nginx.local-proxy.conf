# Usado só por docker-compose.local-proxy.yml — replica o comportamento do
# nginx externo da VPS (fora do Docker, faz proxy_pass removendo o prefixo
# /sistemas/agendaclinica/ antes de repassar pro container "web", ver
# comentário em web/nginx.conf). Sem essa camada, acessar o container "web"
# direto localmente (sem o prefixo já removido) faz os assets buildados com
# base "/sistemas/agendaclinica/" (web/vite.config.ts) caírem no fallback de
# SPA do nginx interno (serve index.html como se fosse o .js, tela em branco).
server {
    listen 80;
    server_name _;

    location /sistemas/agendaclinica/ {
        proxy_pass http://web:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
