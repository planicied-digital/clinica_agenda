# Overlay SÓ para desenvolvimento/teste local — não usar na VPS.
#
# A VPS real tem um nginx fora do Docker (no host) que remove o prefixo
# /sistemas/agendaclinica/ antes de repassar pro container "web" (ver
# comentário em web/nginx.conf). Localmente não existe esse nginx externo,
# então acessar o container "web" direto quebra os assets buildados com
# base "/sistemas/agendaclinica/" — este overlay adiciona um proxy leve que
# faz a mesma remoção de prefixo, só que dentro do próprio docker-compose.
#
# Uso (mesma URL de sempre, http://localhost:8090/sistemas/agendaclinica/):
#   docker compose -f docker-compose.prod.yml -f docker-compose.local-proxy.yml up -d --build
services:
  web:
    ports: !override []

  local-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.local-proxy.conf:/etc/nginx/conf.d/default.conf:ro
